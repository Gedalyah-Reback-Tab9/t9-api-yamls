openapi: 3.0.3
info:
  title: Agent Usage - Tools API
  version: 1.0.0
  description: |
    Returns aggregated usage metrics for an organization, including tools such as
    agent, chat, and code completions.

servers:
  - url: https://console.tabnine.com

paths:
  /api/v1/organization/usage:
    get:
      operationId: getOrganizationUsageTools
      summary: Get organization usage by tools
      description: |
        Returns aggregated usage metrics for an organization over a given time range.
        Includes per-tool metrics for:
        - agent
        - chat
        - codeCompletions
        - instruct

      security:
        - bearerAuth: []

      parameters:
        - name: organizationId
          in: query
          required: true
          description: Organization identifier
          schema:
            type: string
            format: uuid
            example: c19520dc-be63-4b43-a307-c96fccb68962

        - name: from
          in: query
          required: true
          description: Start of the reporting interval (inclusive), in ISO-8601 UTC.
          schema:
            type: string
            format: date-time
            example: 2025-03-23T00:00:00Z

        - name: to
          in: query
          required: true
          description: End of the reporting interval (exclusive or inclusive depending on backend semantics), in ISO-8601 UTC.
          schema:
            type: string
            format: date-time
            example: 2026-02-23T00:00:00Z

        - name: granularity
          in: query
          required: true
          description: Aggregation granularity for usage data.
          schema:
            type: string
            enum: [all, day, week, month]
            example: all

      responses:
        '200':
          description: Organization usage for the requested time range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUsageResponse'
              example:
                organizationId: c19520dc-be63-4b43-a307-c96fccb68962
                from: 2025-03-23T00:00:00Z
                to: 2026-02-23T00:00:00Z
                usage:
                  granularity: all
                  data:
                    - from: 2026-02-23T00:00:00Z
                      to: 2026-02-23T00:00:00Z
                      activeUsers: 131
                      instruct:
                        acceptedCount: 16764
                      productivityFactor: 0.433
                      codeCompletions:
                        activeUsers: 75
                        completions: 7104
                        charsCompleted: 617672
                        keystrokes: 831400
                        lines: 21848
                        automationFactor: 0.426
                      chat:
                        activeUsers: 128
                        interactions: 31336
                        usefulChatInteractions: 17411
                        lines: 38495
                        charsCompleted: 16577
                        chatConsumptionRate: 0.556
                      agent:
                        activeUsers: 103
                        interactions: 11190
                        linesAdded: 1092933
                        linesAddedAccepted: 1080333
                        linesRemoved: 76816
                        linesRemovedAccepted: 75956

        '400':
          description: Invalid request (e.g., missing or invalid query parameters).
        '401':
          description: Authentication failed or missing Bearer token.
        '403':
          description: The caller is not authorized to access this organization’s usage data.
        '500':
          description: Server error retrieving usage data.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    OrganizationUsageResponse:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        usage:
          $ref: '#/components/schemas/UsageEnvelope'
      required:
        - organizationId
        - from
        - to
        - usage

    UsageEnvelope:
      type: object
      properties:
        granularity:
          type: string
          enum: [all, day, week, month]
        data:
          type: array
          items:
            $ref: '#/components/schemas/UsageBucket'
      required:
        - granularity
        - data

    UsageBucket:
      type: object
      description: Aggregated usage metrics for a given time bucket.
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        activeUsers:
          type: integer
          description: Distinct users active in this bucket across tools.
        instruct:
          $ref: '#/components/schemas/InstructUsage'
        productivityFactor:
          type: number
          format: float
          description: Overall productivity factor for this bucket.
        codeCompletions:
          $ref: '#/components/schemas/CodeCompletionsUsage'
        chat:
          $ref: '#/components/schemas/ChatUsage'
        agent:
          $ref: '#/components/schemas/AgentUsage'
      required:
        - from
        - to
        - activeUsers

    InstructUsage:
      type: object
      properties:
        acceptedCount:
          type: integer
          description: Number of accepted instruct interactions.

    CodeCompletionsUsage:
      type: object
      properties:
        activeUsers:
          type: integer
        completions:
          type: integer
        charsCompleted:
          type: integer
        keystrokes:
          type: integer
        lines:
          type: integer
        automationFactor:
          type: number
          format: float

    ChatUsage:
      type: object
      properties:
        activeUsers:
          type: integer
        interactions:
          type: integer
        usefulChatInteractions:
          type: integer
        lines:
          type: integer
        charsCompleted:
          type: integer
        chatConsumptionRate:
          type: number
          format: float

    AgentUsage:
      type: object
      properties:
        activeUsers:
          type: integer
        interactions:
          type: integer
        linesAdded:
          type: integer
        linesAddedAccepted:
          type: integer
        linesRemoved:
          type: integer
        linesRemovedAccepted:
          type: integer
