swagger: '2.0'
info:
  title: User Management API
  description: |
    API endpoints for user invitation and management in the Auth Service.

    These endpoints allow administrators and managers to:
    - Invite new users to teams via email
    - Update existing user properties (role, activation status, team assignment)

    All endpoints require authentication and appropriate role permissions.
  version: 1.0.0
  contact:
    name: Auth Service Team

# In Swagger 2.0, "basePath" replaces servers.url
basePath: /api

schemes:
  - https

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: |
      JWT ID Token obtained from authentication endpoints.

      **Required Roles:**
      - **POST /invitation/v1**: Admin or Manager
      - **PATCH /user/v1/:userId**: Admin or Manager

      Include in the Authorization header as: `Bearer {token}`

security:
  - BearerAuth: []

tags:
  - name: User Invitation
    description: Invite users to teams via email
  - name: User Management
    description: Manage existing users (role, status, team)
  - name: Organization Users
    description: List and inspect users in the organization

paths:
  /invitation/v1:
    post:
      tags:
        - User Invitation
      summary: Invite user by email
      description: |
        Invite a user to join a team with a specific role.

        **Behavior:**
        - If the user already exists in the organization, they will be immediately added to the team
        - If the user doesn't exist, an invitation email will be sent

        **Role Assignment Permissions:**
        - **Admin** can invite users with any role (Member, TeamLead, Manager, Admin)
        - **Manager** can invite users with Member, TeamLead, or Manager roles (cannot invite Admin)

        **Restrictions:**
        - Cannot invite users to teams that have been synced from external groups
        - Team must belong to the same organization as the inviter
      operationId: inviteUserByEmail
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/InviteUserRequest'
          description: Invite user request body
      responses:
        '200':
          description: Existing user successfully added to team
          schema:
            $ref: '#/definitions/InviteUserExistingResponse'
          examples:
            application/json:
              success: true
              message: "Existing user successfully added to team"
              userExists: true
              userId: "987e6543-e21b-12d3-a456-426614174999"
        '201':
          description: Invitation email sent successfully to new user
          schema:
            $ref: '#/definitions/InviteUserNewResponse'
          examples:
            application/json:
              success: true
              message: "Invitation email sent successfully"
              userExists: false
              invitationId: "456e7890-e89b-12d3-a456-426614174111"
        '400':
          description: Bad request - Invalid input or team constraints
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              invalidTeam:
                message: "Team does not belong to this organization"
                status: 400
              syncedTeam:
                message: "Cannot invite users to a team that has been synced from a group"
                status: 400
        '401':
          description: Unauthorized - Missing or invalid authentication token
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              message: "Unauthorized. Valid ID token required."
              status: 401
        '403':
          description: Insufficient permissions to assign role
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              message: "Insufficient permissions to assign this role"
              status: 403
        '404':
          description: Team not found
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              message: "Team not found"
              status: 404
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              message: "Internal server error"
              status: 500
      security:
        - BearerAuth: []

  /user/v1/{userId}:
    patch:
      tags:
        - User Management
      summary: Update user
      description: |
        Update user properties including role, activation status, and team assignment.

        **Available Updates:**
        - **role**: Change the user's role in the organization
        - **active**: Activate or deactivate the user
        - **teamId**: Assign user to a team (or remove from team with `null`)

        **Role Update Permissions:**
        - Acting user must have sufficient permissions to modify the target user's current role
        - Acting user must have sufficient permissions to assign the new role
        - **Admin** can assign any role
        - **Manager** can assign Member, TeamLead, or Manager roles (cannot assign Admin)

        **Restrictions:**
        - Cannot modify own account
        - Cannot modify anonymized users
        - Cannot modify instance administrators
        - Cannot activate/deactivate or change team assignment for synced users

        All fields are optional - provide only the fields you want to update.
      operationId: patchUser
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the user to update
          type: string
          format: uuid
          x-example: "987e6543-e21b-12d3-a456-426614174999"
        - name: body
          in: body
          required: true
          description: Fields to update on the user
          schema:
            $ref: '#/definitions/PatchUserRequest'
      responses:
        '200':
          description: User updated successfully
          schema:
            $ref: '#/definitions/SuccessResponse'
          examples:
            application/json:
              success: true
              message: "User updated successfully"
        '400':
          description: Bad request - Invalid input
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              message: "Invalid role specified"
              status: 400
        '401':
          description: Unauthorized - Missing or invalid authentication token
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              message: "Unauthorized. Valid ID token required."
              status: 401
        '403':
          description: Forbidden - Insufficient permissions or unauthorized action
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              selfModification:
                message: "Cannot modify your own user account"
                status: 403
              instanceAdmin:
                message: "Cannot modify instance administrator"
                status: 403
              teamNotInOrg:
                message: "Team does not belong to this organization"
                status: 403
        '404':
          description: User or team not found
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              userNotFound:
                message: "User not found in organization"
                status: 404
              teamNotFound:
                message: "Team not found"
                status: 404
        '409':
          description: Conflict - User state prevents modification
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              anonymizedUser:
                message: "Cannot modify anonymized user"
                status: 409
              syncedUserActive:
                message: "Cannot activate or deactivate synced user"
                status: 409
              syncedUserTeam:
                message: "Cannot modify team assignment for synced user"
                status: 409
        '422':
          description: Unprocessable Entity - Insufficient permissions for role operation
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              insufficientPermissionsForUser:
                message: "Insufficient permissions to modify this user"
                status: 422
              insufficientPermissionsForRole:
                message: "Insufficient permissions to assign this role"
                status: 422
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              message: "Internal server error"
              status: 500
      security:
        - BearerAuth: []

  /v1/organization/users:
    get:
      tags:
        - Organization Users
      summary: List organization users
      description: |
        Returns a paginated list of users in the organization.

        This endpoint is intended for administrators and managers
        who need to audit or manage organization users.

        Pagination is controlled with `offset` and `limit` query
        parameters.
      operationId: listOrganizationUsers
      produces:
        - application/json
      parameters:
        - name: offset
          in: query
          description: Zero-based index of the first item to return.
          required: false
          type: integer
          format: int32
          minimum: 0
          default: 0
        - name: limit
          in: query
          description: Maximum number of items to return.
          required: false
          type: integer
          format: int32
          minimum: 1
          maximum: 20000
          default: 200
      responses:
        '200':
          description: A paginated list of organization users.
          schema:
            $ref: '#/definitions/OrganizationUserListResponse'
          examples:
            application/json:
              total: 3
              offset: 0
              limit: 200
              users:
                - id: "987e6543-e21b-12d3-a456-426614174999"
                  email: "admin@example.com"
                  displayName: "Admin User"
                  role: "Admin"
                  active: true
                - id: "123e4567-e89b-12d3-a456-426614174000"
                  email: "member1@example.com"
                  displayName: "Member One"
                  role: "Member"
                  active: true
                - id: "456e7890-e89b-12d3-a456-426614174111"
                  email: "manager@example.com"
                  displayName: "Manager User"
                  role: "Manager"
                  active: false
        '401':
          description: Unauthorized - Missing or invalid authentication token
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              message: "Unauthorized. Valid ID token required."
              status: 401
        '403':
          description: Forbidden - Insufficient permissions to list organization users
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              message: "Insufficient permissions to list organization users"
              status: 403
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/Error'
          examples:
            application/json:
              message: "Internal server error"
              status: 500
      security:
        - BearerAuth: []

definitions:
  InviteUserRequest:
    type: object
    required:
      - email
      - teamId
      - role
    properties:
      email:
        type: string
        format: email
        description: Email address of the user to invite
        example: "user@example.com"
      teamId:
        type: string
        format: uuid
        description: UUID of the team to invite the user to
        example: "123e4567-e89b-12d3-a456-426614174000"
      role:
        type: string
        enum:
          - Member
          - TeamLead
          - Manager
          - Admin
        description: |
          Role to assign to the user.
          - Admin can assign any role
          - Manager can assign Member, TeamLead, Manager (not Admin)
        example: "Member"

  InviteUserExistingResponse:
    type: object
    required:
      - success
      - message
      - userExists
      - userId
    properties:
      success:
        type: boolean
        example: true
      message:
        type: string
        example: "Existing user successfully added to team"
      userExists:
        type: boolean
        example: true
        description: Indicates the user already existed in the organization
      userId:
        type: string
        format: uuid
        description: UUID of the existing user
        example: "987e6543-e21b-12d3-a456-426614174999"

  InviteUserNewResponse:
    type: object
    required:
      - success
      - message
      - userExists
      - invitationId
    properties:
      success:
        type: boolean
        example: true
      message:
        type: string
        example: "Invitation email sent successfully"
      userExists:
        type: boolean
        example: false
        description: Indicates a new invitation was created
      invitationId:
        type: string
        format: uuid
        description: UUID of the created invitation
        example: "456e7890-e89b-12d3-a456-426614174111"

  PatchUserRequest:
    type: object
    description: All fields are optional. Provide only the fields you want to update.
    properties:
      role:
        type: string
        enum:
          - Member
          - TeamLead
          - Manager
          - Admin
        description: |
          New role to assign to the user.
          Acting user must have sufficient permissions to assign this role.
        example: "Manager"
      active:
        type: boolean
        description: |
          Activation status of the user.
          Cannot be modified for synced users.
        example: true
      teamId:
        type: string
        format: uuid
        description: |
          UUID of the team to assign the user to.
          Set to `null` to remove the user from their current team.
          Cannot be modified for synced users.
        example: "456e7890-e89b-12d3-a456-426614174111"
        x-nullable: true

  SuccessResponse:
    type: object
    required:
      - success
      - message
    properties:
      success:
        type: boolean
        example: true
      message:
        type: string
        example: "User updated successfully"

  Error:
    type: object
    required:
      - message
    properties:
      message:
        type: string
        description: Error message describing what went wrong
        example: "User not found in organization"
      status:
        type: integer
        description: HTTP status code
        example: 404
      details:
        type: object
        description: Additional error details
        additionalProperties: true

  OrganizationUser:
    type: object
    description: A user in the organization.
    properties:
      id:
        type: string
        format: uuid
        description: Unique identifier of the user.
        example: "987e6543-e21b-12d3-a456-426614174999"
      email:
        type: string
        format: email
        description: User's primary email address.
        example: "user@example.com"
      displayName:
        type: string
        description: User's display name.
        example: "Alex Doe"
      role:
        type: string
        enum:
          - Member
          - TeamLead
          - Manager
          - Admin
        description: User's role in the organization.
        example: "Manager"
      active:
        type: boolean
        description: Whether the user is active.
        example: true
    required:
      - id
      - email
      - displayName
      - role
      - active

  OrganizationUserListResponse:
    type: object
    description: Paginated list of organization users.
    properties:
      total:
        type: integer
        description: Total number of users in the organization.
        example: 157
      offset:
        type: integer
        description: Offset used for this page.
        example: 0
      limit:
        type: integer
        description: Page size used for this request.
        example: 200
      users:
        type: array
        items:
          $ref: '#/definitions/OrganizationUser'
    required:
      - total
      - offset
      - limit
      - users
