openapi: 3.0.3
info:
  title: Usage API
  version: "1.0.0"
  description: |
    Organization-level info APIs for Tabnine usage, including users
    who are not assigned to any team.

servers:
  - url: https://api.example.com  # replace with your real SERVER_URL

paths:
  /api/v1/organization/users:
    get:
      operationId: getUnassignedOrganizationUsers
      summary: Get users who are not assigned to a team
      description: |
        Returns organization users who are not assigned to any team.
        This is modeled after "3.2 Get users who are not assigned to a team"
        in the Usage API spec.
      tags:
        - Organization
        - Users
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 0
          description: |
            Specifies the maximum number of items to return.
            Example: `limit=10` returns only 10 items.
          example: 10
        - name: offset
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 0
          description: |
            Skips a number of items before starting to return results.
            Example: `offset=20` skips the first 20 items and starts from item 21.
          example: 0
        - name: teamMember
          in: query
          required: true
          schema:
            type: boolean
            enum: [false]
          description: |
            Filter by whether the user is a member of a team.
            For this endpoint, this **must be `false`** to return users
            who are not assigned to any team.
          example: false
        - name: active
          in: query
          required: true
          schema:
            type: boolean
          description: |
            When `true`, returns only registered (non-deactivated) users.
            When `false`, returns deactivated users.
          example: true
      responses:
        "200":
          description: Successful response with list of users not assigned to a team.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: List of users.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the user.
                          example: eec77331-89ac-45ff-93fa-31b1df99aaa6
                        username:
                          type: string
                          description: Username of the user.
                          example: ben@example.com
                        email:
                          type: string
                          format: email
                          description: Email of the user.
                          example: ben@example.com
                        verified:
                          type: boolean
                          description: Whether the user's email is verified.
                          example: true
                        role:
                          type: string
                          description: Role of the user within the organization.
                          example: Manager
                        deactivatedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: |
                            Timestamp when the user was deactivated, or `null`
                            if the user is active.
                          example: null
                        updatedAt:
                          type: string
                          format: date-time
                          description: Timestamp of the last update to the user record.
                          example: 2025-04-10T06:53:09.562Z
                  meta:
                    type: object
                    description: Pagination metadata.
                    properties:
                      count:
                        type: integer
                        format: int32
                        description: Number of records returned in this page.
                        example: 1
                      total:
                        type: integer
                        format: int32
                        description: Total number of matching records.
                        example: 1
                required:
                  - data
                  - meta
              examples:
                example-1:
                  summary: Example response
                  value:
                    data:
                      - id: eec77331-89ac-45ff-93fa-31b1df99aaa6
                        username: ben@example.com
                        email: ben@example.com
                        verified: true
                        role: Manager
                        deactivatedAt: null
                        updatedAt: 2025-04-10T06:53:09.562Z
                    meta:
                      count: 1
                      total: 1
        "400":
          description: Invalid or missing parameters.
        "401":
          description: Invalid token.
        "403":
          description: User lacks permission to access this organization's users.
        "404":
          description: Organization not found.
        "500":
          description: Unexpected server error.
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
