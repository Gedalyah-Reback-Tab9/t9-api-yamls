openapi: 3.1.0
info:
  title: Auth Service API
  version: "1.0.0"
  description: |
    OpenAPI 3.1 spec draft for the "v1" endpoints described in the test script comments.

servers:
  - url: https://auth.example.com
    description: Example

tags:
  - name: Team
  - name: User
  - name: Invitation

security:
  - bearerAuth: []

paths:
  /api/team/v1:
    post:
      tags: [Team]
      summary: Create a new team
      description: |
        Auth: Admin, Manager
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/team/v1/{id}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      tags: [Team]
      summary: Get a single team by ID
      description: |
        Auth: Admin, Manager, TeamLead (own team only)
      operationId: getTeam
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamGetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Team]
      summary: Rename a team
      description: |
        Auth: Admin, Manager
        Note: Cannot rename synced teams (400).
      operationId: renameTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTeamRequest"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/user/v1/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [User]
      summary: Get user info
      description: |
        Auth: Admin
        Includes allowedTeams.
      operationId: getUser
      responses:
        "200":
          description: User info with team info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [User]
      summary: Update user properties
      description: |
        Auth: Admin, Manager (with role hierarchy checks)
        Note: Cannot modify self, instance admins, or anonymized users.
        Supports updating role, active status, and team assignment.
      operationId: patchUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUserRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/user/v1/by-email/{email}:
    parameters:
      - name: email
        in: path
        required: true
        description: Email address (URL-encoded)
        schema:
          type: string
          format: email
    get:
      tags: [User]
      summary: Look up a user by email address
      description: |
        Auth: Admin, Manager
        Returns 404 if user not found or belongs to a different org.
      operationId: getUserByEmail
      responses:
        "200":
          description: User summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserByEmailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/user/v1/{userId}/allowed-teams:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [User]
      summary: List teams a user is allowed to access
      description: |
        Auth: Admin, Manager
      operationId: listAllowedTeams
      responses:
        "200":
          description: Allowed teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowedTeamsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [User]
      summary: Add teams to a user's allowed list
      description: |
        Auth: Admin, Manager
        Idempotent add (ON CONFLICT DO NOTHING).
        Body teamIds must contain at least 1 item.
      operationId: addAllowedTeams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamIdsRequest"
      responses:
        "200":
          description: Added (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [User]
      summary: Remove teams from a user's allowed list
      description: |
        Auth: Admin, Manager
        Body teamIds must contain at least 1 item.
        Note: This endpoint uses a request body with DELETE.
      operationId: removeAllowedTeams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamIdsRequest"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/invitation/v1:
    post:
      tags: [Invitation]
      summary: Invite a user by email to a team with a role
      description: |
        Auth: Admin, Manager (with role hierarchy checks)
        Returns:
          - 201 for a new user invitation (includes invitationId)
          - 200 when the user already exists and is added to team (includes userId)
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "200":
          description: Existing user added to team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreate200"
        "201":
          description: Invitation created for new user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreate201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Invitation]
      summary: List pending invitations
      description: |
        Auth: Admin, Manager
        Supports pagination and optional teamId filter.
      operationId: listInvitations
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/TeamIdQuery"
      responses:
        "200":
          description: Paginated invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Invitation]
      summary: Revoke (soft-delete) invitations by IDs
      description: |
        Auth: Admin, Manager (with role hierarchy checks)
        Note: This endpoint uses a request body with DELETE.
      operationId: revokeInvitations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeInvitationsRequest"
      responses:
        "200":
          description: Revocation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeInvitationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TeamId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
      description: Team UUID

    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
      description: User UUID

    Offset:
      name: offset
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
      description: Pagination offset

    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 200
      description: Page size

    TeamIdQuery:
      name: teamId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
      description: Filter invitations by team UUID

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Uuid:
      type: string
      format: uuid

    EmptyObject:
      type: object
      additionalProperties: false

    Error:
      type: object
      additionalProperties: true
      required: [message]
      properties:
        code:
          type: string
          description: Optional machine-readable error code
        message:
          type: string
        details:
          description: Optional details
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: "null"

    Role:
      type: string
      enum: [Member, TeamLead, Manager, Admin]

    Team:
      type: object
      additionalProperties: true
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        organizationId:
          $ref: "#/components/schemas/Uuid"
        syncedGroupId:
          oneOf:
            - type: string
            - type: "null"

    TeamGetResponse:
      type: object
      additionalProperties: true
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        syncedGroupId:
          oneOf:
            - type: string
            - type: "null"

    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    RenameTeamRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    User:
      type: object
      additionalProperties: true
      required: [user_id, email, role]
      properties:
        user_id:
          $ref: "#/components/schemas/Uuid"
        id:
          $ref: "#/components/schemas/Uuid"
          description: Optional alternate identifier, if present in implementation
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        verified:
          type: boolean
        active:
          type: boolean
        allowedTeams:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        teamId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"

    TeamsInfo:
      type: object
      additionalProperties: true
      properties:
        team_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        team_name:
          oneOf:
            - type: string
            - type: "null"

    GetUserResponse:
      type: object
      additionalProperties: true
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        teams:
          $ref: "#/components/schemas/TeamsInfo"

    UserByEmailResponse:
      type: object
      additionalProperties: true
      required: [id, email, role]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        verified:
          type: boolean
        team:
          oneOf:
            - $ref: "#/components/schemas/Team"
            - type: "null"
        allowedTeams:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/Uuid"
            - type: "null"

    PatchUserRequest:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        teamId:
          description: UUID to assign, or null to remove assignment
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
      minProperties: 1

    SuccessMessage:
      type: object
      additionalProperties: true
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    AllowedTeamsResponse:
      type: array
      items:
        $ref: "#/components/schemas/Team"

    TeamIdsRequest:
      type: object
      additionalProperties: false
      required: [teamIds]
      properties:
        teamIds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Uuid"

    Invitation:
      type: object
      additionalProperties: true
      required: [id, email, teamId, role]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        invitationId:
          $ref: "#/components/schemas/Uuid"
          description: Some implementations may use invitationId instead of id
        email:
          type: string
          format: email
        teamId:
          $ref: "#/components/schemas/Uuid"
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, teamId, role]
      properties:
        email:
          type: string
          format: email
        teamId:
          $ref: "#/components/schemas/Uuid"
        role:
          $ref: "#/components/schemas/Role"

    InvitationCreate201:
      type: object
      additionalProperties: true
      required: [success, message, userExists, invitationId]
      properties:
        success:
          type: boolean
        message:
          type: string
        userExists:
          type: boolean
          const: false
        invitationId:
          $ref: "#/components/schemas/Uuid"

    InvitationCreate200:
      type: object
      additionalProperties: true
      required: [success, message, userExists, userId]
      properties:
        success:
          type: boolean
        message:
          type: string
        userExists:
          type: boolean
          const: true
        userId:
          $ref: "#/components/schemas/Uuid"

    InvitationListMeta:
      type: object
      additionalProperties: true
      required: [count, total]
      properties:
        count:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        next:
          description: Implementation-defined pagination cursor / URL / offset
          oneOf:
            - type: string
            - type: integer
            - type: "null"

    InvitationListResponse:
      type: object
      additionalProperties: true
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        meta:
          $ref: "#/components/schemas/InvitationListMeta"

    RevokeInvitationsRequest:
      type: object
      additionalProperties: false
      required: [invitationIds]
      properties:
        invitationIds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Uuid"

    RevokeInvitationsResponse:
      type: object
      additionalProperties: true
      required: [revoked]
      properties:
        revoked:
          type: integer
          minimum: 0
